[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcore-mcp"
version = "0.1.3"
description = "ProofCore Protocol MCP Server: Zero-Auth Cryptographic Notarization on TON Blockchain."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
proofcore-mcp = "proofcore_mcp.server:main"

[tool.setuptools]
packages = ["proofcore_mcp"]